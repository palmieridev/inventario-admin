version: "2"
plugins:
  - name: typescript
    wasm:
      url: https://downloads.sqlc.dev/plugin/sqlc-gen-typescript_0.1.3.wasm
      sha256: 287df8f6cc06377d67ad5ba02c9e0f00c585509881434d15ea8bd9fc751a9368
sql:
  - engine: postgresql
    schema: apps/backend/migrations
    queries: apps/backend/queries
    codegen:
      - plugin: typescript
        out: apps/backend/src/db/consultas
        options:
          runtime: node
          driver: pg
